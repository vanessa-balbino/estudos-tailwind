<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Projeto</title>
    <link href="./dist/output.css" rel="stylesheet" />

</head>

<body class="bg-[#08070C]">

    <section class="relative w-full h-[925px] overflow-hidden">

        <img src="./assets/img/laptop-animation2.gif" alt="" class="absolute inset-0 w-full h-full object-cover">

        <div class="relative z-10 h-full flex flex-col items-center justify-center text-center px-6">
            <h1 class="text-5xl md:text-7xl font-extrabold text-roxo">
                CONHEÇA<br>
                <span class="text-white">NOSSO PORTFÓLIO</span>
            </h1>
        </div>

        <a href="#portfolio" class="absolute bottom-12 left-1/2 -translate-x-1/2 z-10" aria-label="Rolar para baixo">
            <div class="scrolldown" style="--color: #d6c7e7">
                <div class="chevrons">
                    <div class="chevrondown"></div>
                    <div class="chevrondown"></div>
                </div>
            </div>
        </a>

    </section>


    <div class="p-10 flex flex-wrap gap-4">

        <!-- Botão sólido -->
        <button class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold
                 px-10 py-4 rounded-full text-lg shadow transition">
            Saiba mais
        </button>

        <!-- Botão com contorno -->
        <button class="border-2 border-emerald-600 text-emerald-600 hover:bg-emerald-600
                 hover:text-white font-semibold px-10 py-4 rounded-full text-lg transition">
            Contato
        </button>

    </div>
    <div class="card-component flex items-center justify-center">

        <div class="p-10 flex gap-8 flex-wrap">

            <article class="w-[418px] h-[487px] rounded-3xl bg-[#F18803] p-4 flex flex-col">

                <!-- Área da imagem/logo -->
                <div class="aspect-square flex items-center justify-center">
                    <img src="./assets/img/panacuca-logo.png" alt="Logo Panacuca"
                        class="w-[214px] h-[212px] object-contain">
                </div>


                <!-- Barra de cores -->
                <div class="mt-4 flex h-4 gap-1 rounded-full overflow-hidden">
                    <span class="flex-1 bg-red-500 transition-all duration-300 hover:flex-[3]"></span>
                    <span class="flex-1 bg-yellow-400 transition-all duration-300 hover:flex-[3]"></span>
                    <span class="flex-1 bg-green-500 transition-all duration-300 hover:flex-[3]"></span>
                    <span class="flex-1 bg-sky-500 transition-all duration-300 hover:flex-[3]"></span>
                    <span class="flex-1 bg-purple-500 transition-all duration-300 hover:flex-[3]"></span>
                </div>

            </article>
            <!-- card 2 -->
        </div>

        <div class="p-10 flex gap-8 flex-wrap">

            <article class="w-[418px] h-[487px] rounded-3xl bg-[#F18803] p-4 flex flex-col">

                <!-- Área da imagem/logo -->
                <div class="aspect-square flex items-center justify-center">
                    <img src="./assets/img/panacuca-logo.png" alt="Logo Panacuca"
                        class="w-[214px] h-[212px] object-contain">
                </div>


                <!-- Barra de cores -->
                <div class="mt-4 flex h-4 gap-1 rounded-full overflow-hidden">
                    <span class="flex-1 bg-red-500 transition-all duration-300 hover:flex-[3]"></span>
                    <span class="flex-1 bg-yellow-400 transition-all duration-300 hover:flex-[3]"></span>
                    <span class="flex-1 bg-green-500 transition-all duration-300 hover:flex-[3]"></span>
                    <span class="flex-1 bg-sky-500 transition-all duration-300 hover:flex-[3]"></span>
                    <span class="flex-1 bg-purple-500 transition-all duration-300 hover:flex-[3]"></span>
                </div>

            </article>

        </div>

        <!-- card 3 -->

        <div class="p-10 flex gap-8 flex-wrap">

            <article class="w-[418px] h-[487px] rounded-3xl bg-[#F18803] p-4 flex flex-col">

                <!-- Área da imagem/logo -->
                <div class="aspect-square flex items-center justify-center">
                    <img src="./assets/img/panacuca-logo.png" alt="Logo Panacuca"
                        class="w-[214px] h-[212px] object-contain">
                </div>


                <!-- Barra de cores -->
                <div class="mt-4 flex h-6 gap-1">

                    <div class="group relative flex-1 bg-[#e11d48] first:rounded-l-full last:rounded-r-full
              transition-all duration-300 hover:flex-[3]">
                        <span
                            class="pointer-events-none absolute -top-8 left-1/2 z-20 -translate-x-1/2 rounded-full bg-white px-2 py-0.5 text-xs font-medium text-black opacity-0 transition-opacity duration-200 group-hover:opacity-100">#e11d48</span>
                    </div>

                    <div class="group relative flex-1 bg-[#f97316] first:rounded-l-full last:rounded-r-full
              transition-all duration-300 hover:flex-[3]">
                        <span
                            class="pointer-events-none absolute -top-8 left-1/2 z-20 -translate-x-1/2 rounded-full bg-white px-2 py-0.5 text-xs font-medium text-black opacity-0 transition-opacity duration-200 group-hover:opacity-100">#f97316</span>
                    </div>

                    <!-- cores do meio: mesmas classes, só trocando os hex -->

                    <div class="group relative flex-1 bg-[#0ea5e9] first:rounded-l-full last:rounded-r-full
              transition-all duration-300 hover:flex-[3]">
                        <span
                            class="pointer-events-none absolute -top-8 left-1/2 z-20 -translate-x-1/2 rounded-full bg-white px-2 py-0.5 text-xs font-medium text-black opacity-0 transition-opacity duration-200 group-hover:opacity-100">#0ea5e9</span>
                    </div>
                    <div class="group relative flex-1 bg-green-500 first:rounded-l-full last:rounded-r-full
              transition-all duration-300 hover:flex-[3]">
                        <span
                            class="pointer-events-none absolute -top-8 left-1/2 z-20 -translate-x-1/2 rounded-full bg-white px-2 py-0.5 text-xs font-medium text-black opacity-0 transition-opacity duration-200 group-hover:opacity-100">#0ea5e9</span>
                    </div>

                </div>

            </article>

        </div>

    </div>




</body>

</html>
